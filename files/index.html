<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="نظام مبيعات ومخزون يعمل بدون إنترنت">
<title>نظام المبيعات والمخزون</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="المبيعات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* يفضّل ملفات vendor/ المحلية ويرجع للإنترنت إن لم توجد */
window.VND = function (l, c) { try { var x = new XMLHttpRequest(); x.open('GET', l, false); x.send(); if (x.status === 200 && !/html/i.test(x.getResponseHeader('content-type') || '')) return l; } catch (e) { } return c; };
(function () {
  var G = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap', J = 'https://cdn.jsdelivr.net/npm/';
  [['vendor/fonts.css', G], ['vendor/bootstrap.rtl.min.css', J + 'bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css'], ['vendor/bootstrap-icons/bootstrap-icons.min.css', J + 'bootstrap-icons@1.11.3/font/bootstrap-icons.min.css']]
    .forEach(function (a) { document.write('<link rel="stylesheet" href="' + VND(a[0], a[1]) + '">'); });
})();
</script>
<style>
:root{
  --font-head:'Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --font:'IBM Plex Sans Arabic','Noto Kufi Arabic',Tahoma,system-ui,sans-serif;
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f6f9f8; --ink:#0f2a2e; --muted:#5b7074; --line:#d5dedc;
  --accent:#2347c5; --accent-2:#5b7cf0;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --accent-ink:color-mix(in srgb,var(--accent) 80%,#000);
  --ok:#0e8f6a; --warn:#d9730d; --bad:#d6264b;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(15,42,46,.04),0 10px 28px -12px rgba(15,42,46,.22);
  --nav-h:70px;
}
[data-bs-theme=dark]{
  --bg:#0b1416; --surface:#132024; --surface-2:#18282d; --ink:#e6f0ef; --muted:#8aa3a7; --line:#24383d;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
}
html{font-size:calc(16px * var(--fs,1))}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;transition:background .3s}
body.mx-open{overflow:hidden}
h1,h2,h3,h4,h5,h6,.fh{font-family:var(--font-head);font-weight:700;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.btn,.form-control,.form-select{font-family:var(--font)}
.form-control,.form-select{border-radius:var(--r-sm);border-color:var(--line);padding:.6rem .8rem;background-color:var(--surface);color:var(--ink)}
.form-control:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 .22rem color-mix(in srgb,var(--accent) 20%,transparent)}
.form-label{font-size:.82rem;color:var(--muted);margin-bottom:.25rem;font-weight:500}
.btn{border-radius:var(--r-sm);font-weight:600}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0}
.btn-accent:hover,.btn-accent:focus{color:#fff;filter:brightness(1.07)}
.btn-accent:disabled{opacity:.55;color:#fff}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink);border:0}
.btn-soft:hover{background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent-ink)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.text-muted,.muted{color:var(--muted)!important}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:plaintext}
.ltr{direction:ltr;unicode-bidi:plaintext}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:0;z-index:1030;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;display:flex;align-items:center;gap:10px;transition:background .3s}
.topbar::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:8px;background:radial-gradient(circle at 8px 0,transparent 5px,var(--bg) 5.5px) 0 0/16px 8px repeat-x;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.2rem;overflow:hidden;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:var(--font-head);font-size:1.02rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.85;font-size:.72rem;display:block}
.iconbtn{position:relative;border:0;background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.1rem;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.94)}
.dotbadge{position:absolute;top:-5px;inset-inline-start:-5px;min-width:19px;height:19px;border-radius:99px;background:#ffdd57;color:#3a2c00;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
main#view{max-width:1180px;margin:0 auto;padding:14px 12px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:1040;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -14px rgba(15,42,46,.35)}
.bnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;color:var(--muted);text-decoration:none;font-weight:600;padding-top:6px;position:relative}
.bnav a i{font-size:1.2rem;width:46px;height:32px;display:grid;place-items:center;border-radius:16px;transition:all .28s cubic-bezier(.3,1.4,.5,1)}
.bnav a span{transition:transform .25s;white-space:nowrap}
.bnav a.active{color:var(--nc)}
.bnav a.active i{background:linear-gradient(135deg,var(--nc),var(--nc2));color:#fff;transform:translateY(-9px) scale(1.1);box-shadow:0 10px 18px -6px var(--nc)}
.bnav a.active span{transform:translateY(-7px)}
.bnav a.active::after{content:"";position:absolute;bottom:-3px;width:22px;height:4px;border-radius:4px;background:var(--nc)}

/* ---------- surfaces ---------- */
.cardx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px}
.cardx.flat{box-shadow:none}
.sec-title{font-family:var(--font-head);font-size:.95rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-title i{color:var(--accent)}
.hello{border-radius:var(--r-lg);padding:18px;color:#fff;background:linear-gradient(125deg,var(--accent),var(--accent-2));position:relative;overflow:hidden}
.hello h4{margin:0 0 2px;font-size:1.25rem}
.hello p{margin:0;opacity:.9;font-size:.88rem}
.hello .ghost{position:absolute;inset-inline-end:-18px;top:-22px;font-size:7.5rem;opacity:.14;transform:rotate(-12deg)}
.tag{position:relative;border-radius:8px 24px 24px 8px;padding:14px 14px 12px 14px;color:#fff;min-height:100px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:0;text-align:start;width:100%}
.tag::before{content:"";position:absolute;inset-inline-end:12px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.tag .lbl{font-size:.8rem;opacity:.92;font-weight:500;padding-inline-end:22px}
.tag .big{font-family:var(--font-head);font-size:1.3rem;font-weight:800;line-height:1.2;margin-top:6px}
.tag .big small{font-size:.65rem;font-weight:500;opacity:.9;margin-inline-start:3px}
.tag .sub{font-size:.72rem;opacity:.88;border-top:1px dashed rgba(255,255,255,.45);margin-top:8px;padding-top:5px}
.tag:active{transform:scale(.98)}
.g1{background:linear-gradient(135deg,#0e8f6a,#35c79a)}.g2{background:linear-gradient(135deg,#2347c5,#5b7cf0)}
.g3{background:linear-gradient(135deg,#c2255c,#f0668f)}.g4{background:linear-gradient(135deg,#d9730d,#f6a94a)}
.g5{background:linear-gradient(135deg,#a8321f,#e8664d)}.g6{background:linear-gradient(135deg,#6d3fc9,#a47cf0)}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-weight:600;font-size:.82rem;cursor:pointer;width:100%}
.qa i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.qa:active{transform:scale(.96)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 17%,var(--surface));color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.chip.mut{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;border-radius:99px;font-size:.82rem;font-weight:600}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty i{font-size:2.6rem;display:block;margin-bottom:6px;opacity:.6}
.rowx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.rowx:last-child{border-bottom:0}
.rowx .grow{flex:1;min-width:0}
.rowx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx .s{font-size:.76rem;color:var(--muted)}
.icb{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);color:var(--ink);display:inline-grid;place-items:center;flex:none}
.icb:hover{background:var(--accent-soft);color:var(--accent-ink)}
.icb.danger:hover{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-size:.72rem;color:var(--muted);font-weight:600;text-align:start;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin-bottom:12px;overflow-x:auto;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 12px;border-radius:11px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 2px 8px -2px rgba(15,42,46,.25)}

/* ---------- bar chart ---------- */
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:22px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;cursor:pointer;position:relative}
.bar .col{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--accent-2),var(--accent));min-height:4px;transition:height .6s cubic-bezier(.2,.8,.2,1);position:relative}
.bar.today .col{background:linear-gradient(180deg,#35c79a,#0e8f6a)}
.bar .v{font-size:.64rem;color:var(--muted);position:absolute;top:-17px;white-space:nowrap}
.bar .d{font-size:.7rem;color:var(--muted);font-weight:600}
.bar .tip{position:absolute;bottom:calc(100% + 4px);background:var(--ink);color:var(--bg);font-size:.72rem;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.bar:hover .tip,.bar.show .tip{opacity:1}

/* ---------- search ---------- */
.sbox{position:relative}
.sbar{display:flex;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:0 6px 0 12px;gap:8px;transition:border-color .2s,box-shadow .2s}
.sbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
.sbar>i{color:var(--accent);font-size:1.1rem}
.sbar input{border:0;outline:0;background:transparent;flex:1;padding:13px 2px;font-size:1.02rem;color:var(--ink);min-width:0;font-family:var(--font)}
.sbar button{border:0;background:var(--accent-soft);color:var(--accent-ink);width:40px;height:40px;border-radius:13px;font-size:1.1rem;flex:none}
.sbar button.s-clr{background:transparent;color:var(--muted);width:32px}
.sres{position:absolute;inset-inline:0;top:calc(100% + 8px);z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 50px -12px rgba(8,20,24,.45);max-height:60vh;overflow:auto;overscroll-behavior:contain}
.sitem{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px dashed var(--line)}
.sitem:last-child{border-bottom:0}
.sitem.on,.sitem:hover{background:var(--accent-soft)}
.si-main{flex:1;min-width:0}
.si-name{font-weight:600;font-size:.97rem}
.si-sub{font-size:.74rem;color:var(--muted)}
.si-side{text-align:end;display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex:none}
.si-note{padding:8px 14px;font-size:.76rem;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
mark.hl{background:color-mix(in srgb,#ffc928 62%,transparent);color:inherit;border-radius:4px;padding:0 1px;font-weight:700}

/* ---------- POS ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 8px;text-align:start;display:flex;flex-direction:column;gap:3px;min-height:76px;justify-content:space-between;color:var(--ink);position:relative}
.qbtn:active{transform:scale(.96);background:var(--accent-soft)}
.qbtn .n{font-weight:600;font-size:.84rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qbtn .p{font-size:.78rem;color:var(--accent-ink);font-weight:700}
.qbtn .st{position:absolute;top:6px;inset-inline-end:6px}
.cline{padding:10px 0;border-bottom:1px dashed var(--line)}
.cline:last-child{border-bottom:0}
.cl-name{font-weight:600;font-size:.93rem}
.cl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.qty button{border:0;background:transparent;width:34px;height:36px;font-size:1.1rem;color:var(--accent-ink);font-weight:700}
.qty input{width:52px;text-align:center;border:0;background:var(--surface);height:36px;font-weight:700;color:var(--ink);font-family:var(--font)}
.pinp{width:92px;height:36px;border:1px solid var(--line);border-radius:10px;text-align:center;background:var(--surface);color:var(--ink);font-weight:600}
.pinp:disabled{background:var(--surface-2)}
.cl-total{margin-inline-start:auto;font-weight:800;font-family:var(--font-head)}
.ptype{border:0;border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.ptype.w{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.totals{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-md);padding:10px 12px;margin-top:10px}
.totals .r{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:.9rem}
.totals .r.big{font-family:var(--font-head);font-size:1.25rem;font-weight:800;color:var(--accent-ink);border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.sticky-lg{position:static}
@media(min-width:992px){.sticky-lg{position:sticky;top:84px}}
.paybar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.paybar button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:600;color:var(--ink)}
.paybar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- toast / modal ---------- */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);inset-inline:0;z-index:9000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.tst{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.88rem;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);opacity:0;transform:translateY(-10px);transition:all .25s;max-width:92vw}
.tst.in{opacity:1;transform:none}
.tst.success i{color:#4ade9c}.tst.danger i{color:#ff7a93}.tst.warning i{color:#ffc15a}
.mx-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.mx-wrap.show{opacity:1}
.mx-back{position:absolute;inset:0;background:rgba(6,16,20,.6);backdrop-filter:blur(3px)}
.mx{position:relative;background:var(--surface);color:var(--ink);width:100%;max-height:94vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.9,.3,1);box-shadow:0 -14px 50px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px)}
.mx-wrap.show .mx{transform:none}
.mx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mx-head h5{margin:0;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.mx-x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;color:var(--ink)}
.mx-body{padding:16px 18px;overflow:auto;flex:1;overscroll-behavior:contain}
.mx-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mx-foot .btn{flex:1 1 auto}
@media(min-width:768px){.mx-wrap{align-items:center}.mx{width:min(560px,94vw);border-radius:26px;max-height:90vh}.mx.sm{width:min(420px,94vw)}.mx.lg{width:min(860px,95vw)}.mx.xl{width:min(1040px,96vw)}}
.sheet-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface-2);border-radius:var(--r-md);padding:13px 14px;margin-bottom:8px;text-align:start;color:var(--ink);font-weight:600}
.sheet-item i{font-size:1.3rem;color:var(--accent)}
.sheet-item small{display:block;color:var(--muted);font-weight:400}

/* ---------- more menu ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mtile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--ink);box-shadow:var(--shadow);text-decoration:none;position:relative}
.mtile i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.mtile:active{transform:scale(.96)}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:5000;background:linear-gradient(160deg,#0b2f2a,#13314f 60%,#2a1b4d);color:#fff;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lock.on{display:flex}
.lockbox{width:min(340px,100%);text-align:center}
.lockbox .lg{width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:2.2rem;margin:0 auto 12px}
.dots{display:flex;justify-content:center;gap:12px;margin:16px 0;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6);transition:all .15s}

<body data-screen="dashboard">

<style id="pageStyle"></style>
<script>document.write('<script src="' + VND('vendor/dexie.min.js', 'https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js') + '"><\/script><script src="' + VND('vendor/JsBarcode.all.min.js', 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js') + '"><\/script>');</script>
<script>
'use strict';
/* =====================================================================
   نظام المبيعات والمخزون — PWA يعمل بدون إنترنت
   ===================================================================== */
const APP_VERSION = '1.4.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const debounce = (fn, ms = 120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const pad = (n, l = 4) => String(n).padStart(l, '0');
const ss = {
  get: k => { try { return sessionStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch { } },
  del: k => { try { sessionStorage.removeItem(k); } catch { } }
};

/* ---------- أرقام عربية/إنجليزية ---------- */
function latinDigits(s) {
  return String(s ?? '')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g, '.').replace(/٬/g, ',');
}
function toNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(latinDigits(v).replace(/[,\s]/g, ''));
  return isFinite(n) ? n : 0;
}

/* ---------- قاعدة البيانات ---------- */
const db = new Dexie('pos_pwa_db');
db.version(1).stores({
  products: '++id,name,barcode,category,quick,qty,updatedAt',
  customers: '++id,name,phone',
  suppliers: '++id,name,phone',
  sales: '++id,no,ts,customerId,status',
  returns: '++id,no,saleId,ts,customerId',
  purchases: '++id,no,ts,supplierId',
  purchaseReturns: '++id,no,ts,supplierId',
  customerPayments: '++id,customerId,ts',
  supplierPayments: '++id,supplierId,ts',
  expenses: '++id,ts,category',
  categories: '++id,&name',
  users: '++id,name',
  shifts: '++id,openedAt,status',
  closures: '++id,ts',
  stockLog: '++id,productId,ts',
  audit: '++id,ts,action',
  held: '++id,ts',
  settings: 'key',
  counters: 'key'
});

/* ---------- الإعدادات ---------- */
const DEFAULTS = {
  shopName: 'محلي', shopPhone: '', shopAddress: '', shopLogo: '', footerMsg: 'شكراً لتعاملكم معنا',
  currencySymbol: 'د.ع', usdRate: 1500, showUsd: false, taxRate: 0, paper: '80', countryCode: '964',
  lowStockDefault: 5, expiryDays: 30, allowNegative: false, costMethod: 'avg',
  theme: 'auto', fontScale: 100, arabicDigits: false, sound: true,
  lockEnabled: true, backupDays: 7, lastBackup: 0, labelsPerPage: 24, labelCols: 3, quickCount: 12, setupDone: false
};
let S = { ...DEFAULTS };
let nf0, nf2;
function buildNF() {
  const l = S.arabicDigits ? 'ar-EG' : 'en-US';
  nf0 = new Intl.NumberFormat(l, { maximumFractionDigits: 0 });
  nf2 = new Intl.NumberFormat(l, { maximumFractionDigits: 2 });
}
buildNF();
async function loadSettings() {
  const rows = await db.settings.toArray();
  S = { ...DEFAULTS };
  for (const r of rows) S[r.key] = r.value;
  buildNF();
}
async function setSettings(obj) {
  await db.transaction('rw', db.settings, async () => {
    for (const [k, v] of Object.entries(obj)) { S[k] = v; await db.settings.put({ key: k, value: v }); }
  });
  buildNF();
}
const setSetting = (k, v) => setSettings({ [k]: v });

/* ---------- التنسيق ---------- */
const fmtNum = n => { n = Number(n) || 0; return (Math.abs(n - Math.round(n)) < 0.005 ? nf0 : nf2).format(n); };
const money = n => fmtNum(n) + ' ' + S.currencySymbol;
const usd = n => '$' + ((Number(n) || 0) / (S.usdRate || 1)).toFixed(2);
const loc = () => S.arabicDigits ? 'ar-IQ-u-ca-gregory-nu-arab' : 'ar-IQ-u-ca-gregory-nu-latn';
const fmtDate = t => new Date(t).toLocaleDateString(loc(), { year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtTime = t => new Date(t).toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
const fmtDT = t => fmtDate(t) + ' ' + fmtTime(t);
const fmtLong = t => new Date(t).toLocaleDateString(loc(), { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
const compact = n => { n = Math.round(Number(n) || 0); const a = Math.abs(n); if (a >= 1e6) return fmtNum(Math.round(n / 1e5) / 10) + ' م'; if (a >= 1e3) return fmtNum(Math.round(n / 100) / 10) + ' ألف'; return fmtNum(n); };
const barLbl = (n, mx) => { n = Number(n) || 0; return mx >= 1e6 ? fmtNum(Math.round(n / 1e5) / 10) : mx >= 1e3 ? fmtNum(Math.round(n / 100) / 10) : fmtNum(Math.round(n)); };
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
function periodRange(p) {
  const now = Date.now(), sod = startOfDay(now);
  if (p === 'today') return [sod, now + 1];
  if (p === 'week') { const dow = (new Date(sod).getDay() + 1) % 7; return [sod - dow * DAY, now + 1]; } // الأسبوع يبدأ السبت
  if (p === 'month') { const d = new Date(); return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), now + 1]; }
  return [0, now + 1];
}
const PERIODS = [['today', 'اليوم'], ['week', 'الأسبوع'], ['month', 'الشهر'], ['all', 'الكل']];
const periodName = p => (PERIODS.find(x => x[0] === p) || [0, ''])[1];

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const dateStamp = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`; };

/* ---------- الحالة العامة ---------- */
const State = {
  products: [], pmap: new Map(), bcmap: new Map(), customers: [], suppliers: [], categories: [],
  user: null, cart: null, pcart: null, view: 'dashboard'
};
const IDX = new Map(); // فهرس البحث

/* ---------- الصلاحيات ---------- */
const CASHIER_PERMS = new Set(['view_dashboard', 'sell', 'products_view', 'customers', 'customers_edit', 'pay_customer', 'returns', 'inventory_view', 'expenses_add', 'shift']);
const can = p => !!State.user && (State.user.role === 'admin' || CASHIER_PERMS.has(p));

/* ---------- PIN ---------- */
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const hashPin = (pin, salt) => cyrb53(salt + '|' + latinDigits(pin) + '|pos', 7) + cyrb53(latinDigits(pin) + salt, 13);
const randSalt = () => Math.random().toString(36).slice(2, 10);

/* ---------- سجل النشاط وترقيم الفواتير ---------- */
const audit = (action, details = '') => db.audit.add({ ts: Date.now(), user: State.user?.name || '-', action, details }).catch(() => { });
async function nextNo(key, prefix, len = 4) {
  const row = await db.counters.get(key);
  const n = (row?.value || 0) + 1;
  await db.counters.put({ key, value: n });
  return prefix + pad(n, len);
}

/* ---------- تحميل البيانات إلى الذاكرة ---------- */
const bcKey = c => { const s = latinDigits(String(c == null ? '' : c)).replace(/[^0-9A-Za-z]/g, '').toUpperCase(); return /^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s; };
async function loadProducts() {
  const list = await db.products.toArray();
  State.products = list; State.pmap = new Map(); State.bcmap = new Map(); IDX.clear();
  for (const p of list) {
    State.pmap.set(p.id, p);
    const bc = bcKey(p.barcode);
    if (bc) State.bcmap.set(bc, p);
    IDX.set(p.id, { n: norm(p.name), w: norm(p.name).split(' ').filter(Boolean), b: norm(p.barcode || ''), c: norm(p.category || '') });
  }
}
async function loadCustomers() { State.customers = (await db.customers.toArray()).sort((a, b) => a.name.localeCompare(b.name, 'ar')); }
async function loadSuppliers() { State.suppliers = (await db.suppliers.toArray()).sort((a, b) => a.name.localeCompare(b.name, 'ar')); }
async function loadCategories() { State.categories = (await db.categories.toArray()).map(c => c.name).sort((a, b) => a.localeCompare(b, 'ar')); }
const loadAll = () => Promise.all([loadProducts(), loadCustomers(), loadSuppliers(), loadCategories()]);

const stockState = p => (p.qty <= 0 ? 'out' : p.qty <= (p.alertQty ?? S.lowStockDefault) ? 'low' : 'ok');
const expState = p => {
  if (!p.expiry) return null;
  const d = new Date(p.expiry + 'T23:59:59').getTime();
  if (isNaN(d)) return null;
  if (d < Date.now()) return 'expired';
  if (d - Date.now() <= S.expiryDays * DAY) return 'soon';
  return null;
};
function genBarcode() {
  for (let k = 0; k < 50; k++) {
    const base = '29' + String(Date.now()).slice(-8) + String(Math.floor(Math.random() * 100)).padStart(2, '0');
    let sum = 0; for (let i = 0; i < 12; i++) sum += (+base[i]) * (i % 2 ? 3 : 1);
    const code = base + ((10 - sum % 10) % 10);
    if (!State.bcmap.has(bcKey(code))) return code;
  }
  return String(Date.now());
}
const waPhone = ph => { let p = latinDigits(ph).replace(/\D/g, ''); if (!p) return ''; if (p.startsWith('00')) p = p.slice(2); else if (p.startsWith('0')) p = S.countryCode + p.slice(1); return p; };
const waLink = (ph, text) => `https://wa.me/${waPhone(ph)}?text=${encodeURIComponent(text)}`;

/* سجل الأوامر المرتبطة بالأزرار (data-act) */
const A = {};
/* =====================================================================
   محرك البحث الذكي — يطلع المنتج حتى لو كتبت جزء من الاسم أو أخطأت بالحروف
   - توحيد الحروف (أ إ آ → ا ، ى → ي ، ة → ه ...) وإزالة التشكيل
   - أرقام عربية/هندية → إنجليزية
   - كل كلمة مكتوبة لازم تتطابق (بأي ترتيب) بجزء من الاسم أو الباركود أو التصنيف
   - تسامح مع الأخطاء الإملائية (Levenshtein) وحروف ناقصة (Subsequence)
   ===================================================================== */
const CHARMAP = { 'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا', 'ى': 'ي', 'ئ': 'ي', 'ی': 'ي', 'ې': 'ي', 'ؤ': 'و', 'ة': 'ه', 'ہ': 'ه', 'ھ': 'ه', 'گ': 'ك', 'ک': 'ك', 'چ': 'ج', 'پ': 'ب', 'ڤ': 'ف', 'ژ': 'ز' };
function normMap(str) {
  str = String(str ?? '');
  let n = '', map = [];
  for (let i = 0; i < str.length; i++) {
    let c = str[i]; const code = c.charCodeAt(0);
    if ((code >= 0x064B && code <= 0x065F) || code === 0x0670 || code === 0x0640 || code === 0x200C || code === 0x200D || code === 0x200E || code === 0x200F) continue;
    if (code >= 0x0660 && code <= 0x0669) c = String(code - 0x0660);
    else if (code >= 0x06F0 && code <= 0x06F9) c = String(code - 0x06F0);
    else if (CHARMAP[c]) c = CHARMAP[c];
    else c = c.toLowerCase();
    if (!/[\p{L}\p{N}]/u.test(c)) c = ' ';
    if (c === ' ' && n.endsWith(' ')) continue;
    n += c; map.push(i);
  }
  return { n, map };
}
const norm = s => normMap(s).n.trim();
const qTokens = q => norm(q).split(' ').filter(Boolean).map(t => (t.length > 3 && t.startsWith('ال')) ? t.slice(2) : t);

function isSubseq(t, s) { let i = 0; for (let k = 0; k < s.length && i < t.length; k++) if (s[k] === t[i]) i++; return i === t.length; }
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur[j] = v; if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

function tokenScore(t, x, fuzzy) {
  let s = 0;
  if (x.b) {
    if (x.b === t) return 1000;
    if (t.length >= 2 && x.b.startsWith(t)) s = 420;
    else if (t.length >= 3 && x.b.includes(t)) s = 220;
  }
  for (const w of x.w) if (w === t) { s = Math.max(s, 300); break; }
  if (s < 250) for (const w of x.w) if (w.startsWith(t)) { s = Math.max(s, 250); break; }
  if (s < 150 && x.n.includes(t)) s = Math.max(s, 150);
  if (s < 40 && x.c.includes(t)) s = 40;
  if (!s && fuzzy && t.length >= 3) {
    const max = t.length >= 6 ? 2 : 1;
    let best = 99;
    for (const w of x.w) {
      if (w.length < 2) continue;
      const d = Math.min(lev(t, w, max), lev(t, w.slice(0, t.length), max));
      if (d < best) best = d;
    }
    if (best <= max) s = 70 - best * 20;
    else if (isSubseq(t, x.n.replace(/ /g, ''))) s = 25;
  }
  return s;
}

function searchProducts(q, opts = {}) {
  const list = opts.list || State.products, limit = opts.limit || 40;
  const tokens = qTokens(q);
  if (!tokens.length) return { results: [], tokens, approx: false };
  const run = (fuzzy, skip, any) => {
    const out = [];
    for (const p of list) {
      if (skip && skip.has(p.id)) continue;
      const x = IDX.get(p.id); if (!x) continue;
      let tot = 0, ok = true, hit = 0;
      for (const t of tokens) {
        const s = tokenScore(t, x, fuzzy);
        if (!s) { if (!any) { ok = false; break; } } else { tot += s; hit++; }
      }
      if (!ok || !hit) continue;
      tot += (x.n.startsWith(tokens[0]) ? 60 : 0) + Math.min(p.soldCount || 0, 50) / 10 + (p.quick ? 5 : 0);
      out.push({ p, score: tot });
    }
    return out;
  };
  let res = run(false), approx = false;
  if (res.length < 8) {
    const seen = new Set(res.map(r => r.p.id));
    res = res.concat(run(true, seen));
  }
  if (!res.length && tokens.length > 1) { res = run(true, null, true); approx = true; }
  res.sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name, 'ar'));
  return { results: res.slice(0, limit), tokens, approx };
}

/* تظليل الكلمات المطابقة داخل النص الأصلي */
function hl(text, tokens) {
  text = String(text ?? '');
  if (!tokens || !tokens.length) return esc(text);
  const { n, map } = normMap(text);
  const mark = new Array(text.length).fill(false);
  for (const t of tokens) {
    if (!t) continue;
    let i = n.indexOf(t);
    while (i !== -1) {
      const a = map[i], b = map[i + t.length - 1];
      for (let k = a; k <= b; k++) mark[k] = true;
      i = n.indexOf(t, i + t.length);
    }
  }
  let out = '', on = false;
  for (let k = 0; k < text.length; k++) {
    if (mark[k] && !on) { out += '<mark class="hl">'; on = true; }
    if (!mark[k] && on) { out += '</mark>'; on = false; }
    out += esc(text[k]);
  }
  return on ? out + '</mark>' : out;
}

/* بحث بسيط للزبائن والموردين وغيرهم */
function entityFilter(list, q, fields) {
  const tokens = qTokens(q);
  if (!tokens.length) return list;
  return list.filter(o => {
    const h = norm(fields(o).join(' ')), hc = h.replace(/ /g, '');
    return tokens.every(t => h.includes(t) || (t.length >= 4 && isSubseq(t, hc)));
  });
}

function loginScreen() {
  return new Promise(async res => {
    const lock = $('#lock'); lock.classList.add('on');
    const users = await db.users.toArray();
    let sel = users[0], pin = '', fails = 0, blockedUntil = 0;
    const draw = () => {
      lock.innerHTML = `<div class="lockbox" id="lbox"><div class="lg"><i class="bi bi-lock-fill"></i></div>
        <h4 class="mb-1">${esc(S.shopName)}</h4><div class="opacity-75 small">${users.length > 1 ? 'اختر المستخدم وأدخل الرمز' : 'أدخل رمز الدخول'}</div>
        ${users.length > 1 ? `<div class="d-flex gap-2 justify-content-center flex-wrap mt-3">${users.map(u => `<button class="ucard ${u.id === sel.id ? 'on' : ''}" data-u="${u.id}">${esc(u.name)}</button>`).join('')}</div>` : ''}
        <div class="dots">${Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
        <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="del"><i class="bi bi-backspace"></i></button><button data-k="0">0</button><button data-k="ok"><i class="bi bi-check-lg"></i></button></div>
        <button class="btn btn-link text-white-50 mt-3" data-forgot>نسيت الرمز؟</button></div>`;
    };
    const verify = () => {
      if (Date.now() < blockedUntil) { toast('محاولات كثيرة، انتظر قليلاً', 'warning'); return; }
      if (hashPin(pin, sel.salt) === sel.pin) {
        State.user = sel; ss.set('uid', String(sel.id)); lock.classList.remove('on'); lock.innerHTML = ''; audit('دخول', sel.name); res();
      } else {
        fails++; if (fails >= 5) { blockedUntil = Date.now() + 30000; fails = 0; }
        pin = ''; draw(); const b = $('#lbox'); b.classList.add('shake'); beep(220, 160);
      }
    };
    lock.onclick = async e => {
      const u = e.target.closest('[data-u]'); if (u) { sel = users.find(x => x.id === +u.dataset.u); pin = ''; return draw(); }
      if (e.target.closest('[data-forgot]')) return recover();
      const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return;
      if (k === 'del') pin = pin.slice(0, -1); else if (k === 'ok') return verify(); else if (pin.length < 8) pin += k;
      draw();
    };
    async function recover() {
      const code = await askInput({ title: 'استرجاع الوصول', label: 'أدخل رمز الاسترجاع (8 أرقام)', inputmode: 'numeric', ok: 'تحقق' });
      if (code == null) return;
      if (hashPin(code.trim(), 'rec') !== S.recoveryHash) return toast('رمز الاسترجاع غير صحيح', 'danger');
      const admin = users.find(u => u.role === 'admin') || users[0];
      const np = await askInput({ title: 'رمز جديد لـ ' + admin.name, label: 'PIN جديد (4-8 أرقام)', inputmode: 'numeric', type: 'password' });
      const v = latinDigits(np || '');
      if (!/^\d{4,8}$/.test(v)) return toast('الرمز لازم 4-8 أرقام', 'warning');
      const salt = randSalt(); await db.users.update(admin.id, { salt, pin: hashPin(v, salt) });
      admin.salt = salt; admin.pin = hashPin(v, salt); toast('تم تغيير الرمز', 'success');
    }
    draw();
  });
}

const IMPORT_ALIAS = {
  name: ['الاسم', 'اسم المنتج', 'المنتج', 'name', 'product', 'item'], barcode: ['الباركود', 'باركود', 'barcode', 'code', 'sku'],
  category: ['التصنيف', 'الفئة', 'category'], unit: ['الوحدة', 'unit'], buy: ['سعر الشراء', 'الشراء', 'التكلفة', 'cost', 'buy'],
  retail: ['سعر المفرد', 'سعر البيع', 'المفرد', 'السعر', 'price', 'retail'], wholesale: ['سعر الجملة', 'الجملة', 'wholesale'],
  qty: ['الكمية', 'المخزون', 'qty', 'quantity', 'stock'], alert: ['حد التنبيه', 'حد الطلب', 'alert', 'min'], quick: ['سريع', 'quick'], expiry: ['تاريخ الانتهاء', 'الانتهاء', 'expiry']
};
async function importProductsFile(file) {
  await ensureLib('xlsx');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
  if (!rows.length) throw new Error('الملف فارغ');
  const al = {}; for (const k in IMPORT_ALIAS) al[k] = IMPORT_ALIAS[k].map(norm);
  const get = (row, k) => { for (const key of Object.keys(row)) if (al[k].includes(norm(key))) return row[key]; return undefined; };
  const plan = [], errors = []; const seenBC = new Map(), seenName = new Map();
  rows.forEach((row, i) => {
    const name = String(get(row, 'name') ?? '').trim();
    if (!name) { errors.push(`سطر ${i + 2}: الاسم فارغ`); return; }
    let bc = latinDigits(String(get(row, 'barcode') ?? '')).trim();
    const ex = (bc && State.bcmap.get(bcKey(bc))) || State.products.find(p => norm(p.name) === norm(name));
    const has = k => get(row, k) !== undefined && get(row, k) !== '';
    const rec = { name, barcode: bc, category: String(get(row, 'category') ?? '').trim(), unit: String(get(row, 'unit') ?? '').trim() };
    if (has('buy')) rec.buyPrice = toNum(get(row, 'buy'));
    if (has('retail')) rec.retailPrice = toNum(get(row, 'retail'));
    if (has('wholesale')) rec.wholesalePrice = toNum(get(row, 'wholesale'));
    if (has('qty')) rec.qty = toNum(get(row, 'qty'));
    if (has('alert')) rec.alertQty = toNum(get(row, 'alert'));
    if (has('quick')) rec.quick = /^(1|نعم|yes|true)$/i.test(String(get(row, 'quick')).trim()) ? 1 : 0;
    if (has('expiry')) rec.expiry = String(get(row, 'expiry')).slice(0, 10);
    if (bc && seenBC.has(bc) && seenBC.get(bc) !== ex?.id && !ex) { errors.push(`سطر ${i + 2}: باركود مكرر داخل الملف (${bc})`); return; }
    if (!ex && !has('retail')) { errors.push(`سطر ${i + 2}: "${name}" بدون سعر مفرد`); return; }
    if (bc) seenBC.set(bc, ex?.id || 1);
    plan.push({ ex, rec });
  });
  const add = plan.filter(x => !x.ex).length, upd = plan.length - add;
  const ok = await confirmBox(`سيتم <b>إضافة ${fmtNum(add)}</b> منتج جديد و<b>تحديث ${fmtNum(upd)}</b> منتج موجود.${errors.length ? `<br><span class="text-danger small">${fmtNum(errors.length)} سطر سيتم تجاهله.</span>` : ''}`, { title: 'استيراد من Excel', ok: 'استيراد' });
  if (!ok) return;
  const now = Date.now(), newCats = new Set();
  await db.transaction('rw', db.products, db.categories, db.stockLog, async () => {
    for (const { ex, rec } of plan) {
      if (rec.category && !State.categories.includes(rec.category)) newCats.add(rec.category);
      if (ex) {
        const upd = { ...rec, updatedAt: now };
        for (const k of ['category', 'unit', 'barcode']) if (!upd[k]) delete upd[k];
        await db.products.update(ex.id, upd);
        if (rec.qty !== undefined && rec.qty !== ex.qty) await db.stockLog.add({ productId: ex.id, name: ex.name, ts: now, delta: round2(rec.qty - ex.qty), before: ex.qty, after: rec.qty, reason: 'استيراد Excel', userName: State.user.name });
      } else {
        await db.products.add({
          name: rec.name, barcode: rec.barcode || '', category: rec.category || '', unit: rec.unit || 'قطعة', buyPrice: rec.buyPrice || 0, retailPrice: rec.retailPrice || 0,
          wholesalePrice: rec.wholesalePrice || 0, qty: rec.qty || 0, alertQty: rec.alertQty ?? S.lowStockDefault, quick: rec.quick || 0, expiry: rec.expiry || '',
          packName: '', packQty: 0, packPrice: 0, packWholesale: 0, createdAt: now, updatedAt: now, soldCount: 0, lastSold: 0
        });
      }
    }
    for (const name of newCats) await db.categories.add({ name }).catch(() => { });
  });
  audit('استيراد Excel', `${add} جديد / ${upd} تحديث`);
  await Promise.all([loadProducts(), loadCategories()]);
  openModal({
    title: '<i class="bi bi-check-circle text-success"></i> اكتمل الاستيراد', size: 'sm',
    body: `<p>أُضيف <b>${fmtNum(add)}</b> وتحدّث <b>${fmtNum(upd)}</b>.</p>${errors.length ? `<div class="small text-danger" style="max-height:180px;overflow:auto">${errors.slice(0, 40).map(esc).join('<br>')}</div>` : ''}`,
    footer: `<button class="btn btn-accent w-100" data-mx-close>تم</button>`
  });
  refreshView();
}

async function finalizeSale() {
  const c = State.cart; if (!c || !c.items.length) return toast('السلة فارغة', 'warning');
  if (selling) return;
  const t = cartCalc();
  if (t.due > 0.009 && !c.customerId) { beep(200, 200); toast('البيع الآجل يحتاج تحديد زبون', 'danger'); $('#c-cust')?.classList.add('shake'); return; }
  const cust = c.customerId ? State.customers.find(x => x.id === c.customerId) : null;
  if (t.due > 0.009 && cust && cust.creditLimit > 0 && (cust.balance || 0) + t.due > cust.creditLimit) {
    if (!can('credit_override')) return toast(`هذا البيع يتجاوز سقف دين الزبون (${money(cust.creditLimit)})`, 'danger');
    if (!await confirmBox(`دين الزبون سيصبح ${money((cust.balance || 0) + t.due)} وهو أعلى من السقف ${money(cust.creditLimit)}. متابعة؟`)) return;
  }
  selling = true; $('#pay-btn')?.setAttribute('disabled', '');
  try {
    const ts = Date.now(); let sale;
    await db.transaction('rw', db.products, db.sales, db.customers, db.counters, async () => {
      const need = {};
      for (const l of c.items) need[l.pid] = (need[l.pid] || 0) + l.qty * l.factor;
      const prods = {};
      for (const pid of Object.keys(need)) {
        const p = await db.products.get(+pid);
        if (!p) throw new Error('أحد المنتجات محذوف من النظام');
        if (!S.allowNegative && p.qty < need[pid] - 1e-9) throw new Error(`المخزون غير كافٍ: ${p.name} (المتوفر ${fmtNum(p.qty)})`);
        prods[pid] = p;
      }
      for (const pid of Object.keys(need)) { const p = prods[pid]; await db.products.update(+pid, { qty: round2(p.qty - need[pid]), soldCount: round2((p.soldCount || 0) + need[pid]), lastSold: ts }); }
      let custBalance = 0;
      if (cust) { const cu = await db.customers.get(cust.id); custBalance = round2((cu.balance || 0) + t.due); await db.customers.update(cust.id, { balance: custBalance }); }
      const no = await nextNo('sale', 'INV-');
      sale = {
        no, ts, customerId: cust ? cust.id : null, customerName: cust ? cust.name : '', customerPhone: cust ? cust.phone || '' : '', custBalance,
        items: c.items.map(l => ({ pid: l.pid, name: l.name, category: l.category, unit: l.unit, unitMode: l.unitMode, qty: l.qty, factor: l.factor, price: l.price, priceType: l.priceType, cost: l.cost, returnedQty: 0 })),
        subtotal: t.sub, discount: t.disc, tax: t.tax, total: t.total, paid: round2(Math.min(t.paid, t.total)), given: t.paid, change: t.change, due: t.due,
        method: c.method, profit: round2(t.profit), status: 'active', userId: State.user.id, userName: State.user.name, note: c.note || '', returnedTotal: 0
      };
      sale.id = await db.sales.add(sale);
    });
    audit('بيع', `${sale.no} — ${money(sale.total)}`);
    await Promise.all([loadProducts(), loadCustomers()]);
    State.cart = newCart(); saveCart(); beep(1200, 120);
    if (State.view === 'pos') { drawCart(); drawQuick(); $('#possearch .s-in')?.focus(); }
    showReceipt(sale, { fresh: true });
  } catch (e) { fail(e); drawCart(); }
  finally { selling = false; }
}

const fileToDataURL = (file, max = 2000, q = 0.7) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q)); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('تعذّر قراءة الصورة')); }; img.src = url;
});

const RP = { p: 'month' };
async function computeReport(from, to) {
  const [all, rets, exps, pays] = await Promise.all([
    db.sales.where('ts').between(from, to).toArray(), db.returns.where('ts').between(from, to).toArray(),
    db.expenses.where('ts').between(from, to).toArray(), db.customerPayments.where('ts').between(from, to).toArray()]);
  const sales = all.filter(s => s.status !== 'void');
  const r = { sales, rets, exps, gross: 0, retT: 0, profit: 0, expT: 0, newDebt: 0, collected: pays.reduce((a, p) => a + p.amount, 0), cat: {}, item: {}, cust: {} };
  for (const s of sales) {
    r.gross += s.total; r.profit += s.profit; r.newDebt += s.due;
    const nr = s.subtotal > 0 ? (s.subtotal - s.discount) / s.subtotal : 1;
    for (const l of s.items) {
      const c = l.category || 'بدون تصنيف', a = l.qty * l.price * nr;
      r.cat[c] = (r.cat[c] || 0) + a;
      const it = r.item[l.pid] = r.item[l.pid] || { name: l.name, qty: 0, profit: 0 };
      it.qty += l.qty; it.profit += l.qty * (l.price * nr - l.cost);
    }

const getOpenShift = () => db.shifts.where('status').equals('open').first();
async function cashSummary(from, to) {
  const rng = t => t.where('ts').between(from, to);
  const [sales, cp, rets, exps, sp, purs, prets, voided] = await Promise.all([rng(db.sales).toArray(), rng(db.customerPayments).toArray(), rng(db.returns).toArray(), rng(db.expenses).toArray(), rng(db.supplierPayments).toArray(), rng(db.purchases).toArray(), rng(db.purchaseReturns).toArray(), db.sales.where('status').equals('void').toArray()]);
  const sum = (arr, f) => round2(arr.reduce((a, x) => a + f(x), 0)), cash = x => x.method === 'cash';
  const o = {
    cashSales: sum(sales.filter(cash), s => s.paid), custPay: sum(cp.filter(cash), p => p.amount), purRetCash: sum(prets.filter(cash), r => r.total),
    retCash: sum(rets.filter(cash), r => r.total), expenses: sum(exps, e => e.amount), supPay: sum(sp.filter(cash), p => p.amount), purPaid: sum(purs.filter(cash), p => p.paid),
    voidOut: sum(voided.filter(s => s.voidTs >= from && s.voidTs < to && cash(s)), s => s.paid)
  };
  const act = sales.filter(s => s.status !== 'void');
  o.salesTotal = sum(act, s => s.total); o.salesCount = act.length; o.retTotal = sum(rets, r => r.total); o.profit = round2(sum(act, s => s.profit) - sum(rets, r => r.profitDelta));
  o.nonCash = round2(o.salesTotal - sum(act.filter(cash), s => s.paid) - sum(act, s => s.due));
  o.newDebt = sum(act, s => s.due);
  o.inflow = round2(o.cashSales + o.custPay + o.purRetCash); o.outflow = round2(o.retCash + o.expenses + o.supPay + o.purPaid + o.voidOut);
  return o;
}
function cashRowsHTML(o) {

}

  if (over) a.push({ type: 'debt', icon: 'bi-person-exclamation text-danger', text: `${fmtNum(over)} زبون تجاوز سقف الدين`, to: 'customers' });
  if (can('settings') && (P.length || State.customers.length) && Date.now() - (S.lastBackup || 0) > S.backupDays * DAY)

async function exportBackup() {
  const data = {};
  for (const t of db.tables) data[t.name] = await t.toArray();
  download(new Blob([JSON.stringify({ app: 'pos-pwa', version: 1, exportedAt: Date.now(), data })], { type: 'application/json' }), `backup-${S.shopName}-${dateStamp()}.json`);
  await setSetting('lastBackup', Date.now()); audit('نسخة احتياطية'); toast('تم حفظ النسخة الاحتياطية', 'success'); updateBell();
}
A['backup-now'] = () => exportBackup().then(() => refreshView()).catch(fail);
async function importBackup(file) {
  let j; try { j = JSON.parse(await file.text()); } catch { throw new Error('الملف غير صالح'); }
  if (!j || j.app !== 'pos-pwa' || !j.data || typeof j.data !== 'object') throw new Error('هذا ليس ملف نسخة احتياطية لهذا النظام');
  const names = db.tables.map(t => t.name), found = Object.keys(j.data).filter(k => names.includes(k) && Array.isArray(j.data[k]));
  if (!found.length) throw new Error('الملف لا يحتوي بيانات');
  if (!await confirmBox(`سيتم <b>استبدال كل البيانات الحالية</b> بنسخة بتاريخ ${fmtDT(j.exportedAt || Date.now())} (${found.length} جدول). متابعة؟`, { danger: true, ok: 'استعادة' })) return;
  await db.transaction('rw', db.tables, async () => { for (const k of found) { await db.table(k).clear(); if (j.data[k].length) await db.table(k).bulkAdd(j.data[k]); } });
  ss.del('cart'); toast('تمت الاستعادة، جارٍ إعادة التشغيل...', 'success'); setTimeout(() => location.reload(), 900);
}
async function resetSystem() {
  if (!await confirmBox('<b>سيتم حذف كل البيانات نهائياً</b> (منتجات، فواتير، زبائن...). هذا لا يمكن التراجع عنه.', { danger: true, ok: 'متابعة' })) return;
  const pin = await askInput({ title: 'تأكيد بالرمز', label: 'أدخل رمز PIN الخاص بك', type: 'password', inputmode: 'numeric', ok: 'حذف كل شي' });
  if (pin === null) return;
  if (hashPin(pin, State.user.salt) !== State.user.pin) return toast('الرمز غير صحيح', 'danger');
  await db.delete(); ss.del('cart'); ss.del('uid'); location.reload();
}

  const seq = ++renderSeq; let [id, ...params] = parseHash(), v = VIEWS[id];
  if (!v || !can(v.perm)) { id = 'dashboard'; v = VIEWS.dashboard; }
  State.view = id; document.body.dataset.screen = id; if (id !== 'pos') { const cb = $('#cartbar'); if (cb) cb.remove(); } setColors(v.c); renderChrome();
  const el = $('#view');
  try { await v.fn(el, params); }
  catch (e) { console.error(e); if (seq === renderSeq) el.innerHTML = empty('bi-bug', 'حدث خطأ أثناء عرض هذه الشاشة', `<div class="small mt-1">${esc(e.message || '')}</div>`); }
  if (!keep) window.scrollTo(0, 0);
}
const refreshView = () => render(true);

function viewMore(el) {
  const T = (act, to, icon, label, c1, c2, perm) => !perm || can(perm) ? `<button class="mtile" style="--c1:${c1};--c2:${c2}" data-act="${act}" ${to ? `data-to="${to}"` : ''}><i class="bi ${icon}"></i>${label}</button>` : '';
  el.innerHTML = `<div class="stage"><div class="hello mb-3"><i class="bi bi-person-circle ghost"></i><h4>${esc(State.user.name)}</h4><p>${State.user.role === 'admin' ? 'مدير النظام' : 'كاشير'} · ${esc(S.shopName)}</p></div>
    <div class="mgrid">
      ${T('go', 'returns', 'bi-arrow-return-left', 'المرتجعات', '#c2370f', '#f08a5d', 'returns')}${T('go', 'inventory', 'bi-boxes', 'المخزون', '#0b8a86', '#3cc7c2', 'inventory_view')}
      ${T('go-count', '', 'bi-clipboard-check', 'الجرد الفعلي', '#0a7ea4', '#3fb6dd', 'adjust_stock')}${T('go', 'shift', 'bi-safe-fill', 'الصندوق والوردية', '#5b4bd6', '#8f84f2', 'shift')}
      ${T('go', 'expenses', 'bi-wallet2', 'المصاريف', '#b4531f', '#e8925c', 'expenses_add')}${T('go', 'users', 'bi-person-gear', 'المستخدمون', '#2347c5', '#5b7cf0', 'users')}
      ${T('go', 'audit', 'bi-journal-text', 'سجل النشاط', '#6d3fc9', '#a47cf0', 'audit')}${T('go', 'settings', 'bi-gear-fill', 'الإعدادات', '#3d5a63', '#7f9da6', 'settings')}
      ${T('backup-now', '', 'bi-cloud-arrow-down-fill', 'نسخة احتياطية', '#0e8f6a', '#35c79a', 'settings')}${T('lock', '', 'bi-lock-fill', 'قفل التطبيق', '#d6264b', '#f0668f')}</div></div>`;
}
A['go-count'] = () => { IV.tab = 'count'; go('inventory'); };
A['lock'] = async () => {
  audit('خروج'); State.user = null; ss.del('uid'); $('#view').innerHTML = '';
  await loginScreen(); await Promise.all([loadCustomers()]); renderChrome(); render();
};

/* ---------- التحديث ---------- */
let updating = false;
function showUpdate(w) {
  confirmBox('يتوفر إصدار جديد من التطبيق. تحديث الآن؟', { title: 'تحديث متاح', ok: 'تحديث' }).then(yes => { if (yes) { updating = true; w.postMessage('SKIP_WAITING'); } });
}
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); }); });
    const chk = () => reg.update().catch(() => { });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });
    setInterval(chk, 60 * 60 * 1000);
  }).catch(e => console.warn('SW', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (updating) location.reload(); });
}

/* ---------- القفل الأولي ---------- */
async function authInit() {
  const users = await db.users.toArray();
  if (!users.length || !S.setupDone) { await firstRun(); return; }
  if (!S.lockEnabled) { State.user = users.find(u => u.role === 'admin') || users[0]; return; }
  const uid = ss.get('uid'), u = uid && users.find(x => String(x.id) === uid);
  if (u) State.user = u; else await loginScreen();
}

/* ---------- ربط الأحداث ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  Promise.resolve(fn(el, e)).catch(fail);
});
document.addEventListener('change', e => { if (State.view === 'pos') posOnChange(e); });
document.addEventListener('input', e => { if (State.view === 'pos') posOnInput(e); });
document.addEventListener('keydown', globalKeys);
window.addEventListener('hashchange', () => render());
window.addEventListener('offline', () => toast('لا يوجد اتصال — التطبيق يعمل بدون إنترنت', 'warning', 3500));
window.addEventListener('online', () => toast('عاد الاتصال بالإنترنت', 'success'));
if (window.visualViewport) {
  let mh = visualViewport.height;
  visualViewport.addEventListener('resize', () => { const hh = visualViewport.height; mh = Math.max(mh, hh); document.body.classList.toggle('kb', innerWidth < 768 && hh < mh * 0.78); });
  window.addEventListener('orientationchange', () => setTimeout(() => { mh = visualViewport.height; document.body.classList.remove('kb'); }, 400));
}
window.addEventListener('error', e => { if (/ResizeObserver/.test(e.message || '')) return; console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); if (e.reason && e.reason.name === 'QuotaExceededError') toast('مساحة التخزين ممتلئة!', 'danger'); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.theme === 'auto') applyTheme(); });

async function boot() {
  if (typeof Dexie === 'undefined') {
    $('#view').innerHTML = `<div class="empty" style="padding:60px 10px"><i class="bi bi-wifi-off"></i><b>تعذّر تحميل المكتبات</b><div class="small mt-2">افتح التطبيق مرة واحدة مع الإنترنت ليتم حفظ كل شي، وبعدها يشتغل بدون اتصال.</div><button class="btn btn-accent mt-3" onclick="location.reload()">إعادة المحاولة</button></div>`;
    return;
  }
  try {
    await db.open(); await loadSettings(); applyTheme();
    await authInit(); await loadAll();
    State.cart = loadCart() || newCart();
    if (!location.hash) location.hash = '#/dashboard';
    renderChrome(); await render();
    registerSW();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
    $('#splash')?.remove();
  } catch (e) {
    console.error(e); $('#splash')?.remove();
    $('#view').innerHTML = `<div class="empty" style="padding:60px 10px"><i class="bi bi-exclamation-octagon"></i><b>تعذّر فتح قاعدة البيانات</b><div class="small mt-2">${esc(e.message || '')}<br>تأكد أنك لا تستخدم التصفح الخفي، وأن مساحة التخزين متاحة.</div></div>`;
  }
}
boot();
</script>
</body>
</html>
